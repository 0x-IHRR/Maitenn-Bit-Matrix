const FAN_WORD = { youtube: '订阅', zsz: '注册用户', channels: '关注者' };
const safeUrl = (u) => /^https?:\/\//.test(u || '') ? esc(u) : '';
const dayStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const daysBack = (n) => Array.from({ length: n }, (_, i) => dayStr(new Date(Date.now() - (n - 1 - i) * 864e5)));

let O = null, F = {};
const sum = (arr, k) => arr.reduce((s, r) => s + (r[k] || 0), 0);
const inter = (m) => m ? (m.likes || 0) + (m.comments || 0) + (m.favorites || 0) + (m.shares || 0) : 0;

const latest = (p) => { const d = Object.keys(F[p] || {}).sort(); return d.length ? F[p][d[d.length - 1]] : null; };
const gainN = (p, n) => { const t = dayStr(new Date()), b = dayStr(new Date(Date.now() - n * 864e5)); return F[p] && F[p][t] != null && F[p][b] != null ? F[p][t] - F[p][b] : null; };
const netOn = (p, d) => { const prev = dayStr(new Date(new Date(d + 'T12:00').getTime() - 864e5)); return F[p] && F[p][d] != null && F[p][prev] != null ? F[p][d] - F[p][prev] : null; };
const gp = (label, v) => v == null ? '' : `<span class="gpill">${label}<b class="${v < 0 ? 'neg' : ''}">${sgn(v)}</b></span>`;

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); const m = v / p; return (m <= 1 ? 1 : m <= 1.5 ? 1.5 : m <= 2 ? 2 : m <= 3 ? 3 : m <= 4 ? 4 : m <= 5 ? 5 : m <= 7.5 ? 7.5 : 10) * p; }
// 每日净增：按平台堆叠的柱，发布日打标记
function drawFans(el, days, marks) {
  const w = el.clientWidth, h = el.clientHeight; if (w < 60 || h < 60) return;
  const L = 40, R = 6, T = 20, B = 20, n = days.length, pw = w - L - R, ph = h - T - B, band = pw / n, bw = Math.min(22, Math.max(3, band - 4));
  const rows = days.map(d => ({ d, segs: FANP.map(p => ({ p, v: Math.max(0, netOn(p, d) || 0) })).filter(x => x.v > 0) }));
  rows.forEach(r => r.tot = r.segs.reduce((s, x) => s + x.v, 0));
  const top = niceMax(Math.max(...rows.map(r => r.tot), 1)), Y = (v) => T + ph - v / top * ph;
  let s = `<svg width="${w}" height="${h}"><defs>${FANP.map(p => `<linearGradient id="fg-${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--p-${p})"/><stop offset="1" stop-color="var(--p-${p})" stop-opacity=".55"/></linearGradient>`).join('')}</defs>`;
  for (const t of [0, top / 2, top]) s += `<line x1="${L}" x2="${w - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(0,0,0,.07)"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${t ? '+' : ''}${fmt(t)}</text>`;
  rows.forEach((r, i) => {
    const x = L + i * band + (band - bw) / 2; let acc = 0;
    r.segs.forEach((g, j) => { const y1 = Y(acc), y2 = Y(acc + g.v), hh = Math.max(1.5, y1 - y2 - (j < r.segs.length - 1 ? 2 : 0)); acc += g.v;
      s += `<rect class="bar" style="animation-delay:${i * 16}ms" x="${x.toFixed(1)}" y="${(y1 - (y1 - y2)).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="${j === r.segs.length - 1 ? Math.min(4, bw / 2) : 1.5}" fill="url(#fg-${g.p})"/>`; });
    let mk = marks[r.d]; const nx = rows[i + 1] && marks[rows[i + 1].d], pv = rows[i - 1] && marks[rows[i - 1].d];
    const lab = !mk || nx ? '' : pv ? pv + ' / ' + mk : mk;
    if (mk) s += `<line x1="${(x + bw / 2).toFixed(1)}" x2="${(x + bw / 2).toFixed(1)}" y1="${T - 6}" y2="${T + ph}" stroke="#0071e3" stroke-opacity=".45" stroke-dasharray="3 3"/><text x="${(x + bw / 2).toFixed(1)}" y="${T - 9}" text-anchor="${i > n - 3 ? 'end' : 'middle'}" style="fill:var(--accent);font-weight:600">${esc(lab)}</text>`;
    if ((i % 5 === 0 && n - 1 - i > 4) || i === n - 1) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${h - 5}" text-anchor="${i === n - 1 ? 'end' : 'middle'}">${r.d.slice(5)}</text>`;
    s += `<rect x="${(L + i * band).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${ph}" fill="transparent" data-tip="${r.d.slice(5)}${mk ? '  ' + esc(mk) + ' 发布' : ''}\n${r.segs.length ? r.segs.map(g => PN[g.p] + '  +' + fmt(g.v)).join('\n') + '\n合计  +' + fmt(r.tot) : '没有记录'}"/>`;
  });
  el.innerHTML = s + '</svg>';
}
function sparkLine(p) {
  const d = daysBack(30).filter(x => F[p] && F[p][x] != null); if (d.length < 3) return '';
  const v = d.map(x => F[p][x]), lo = Math.min(...v), hi = Math.max(...v), W = 200, H = 40, X = (i) => i / (d.length - 1) * W, Y = (y) => H - 3 - (hi === lo ? .5 : (y - lo) / (hi - lo)) * (H - 8);
  const pts = v.map((y, i) => `${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-tip="${PN[p]} 近 ${d.length} 天\n${fmt(v[0])} → ${fmt(v[v.length - 1])}"><defs><linearGradient id="sl-${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--p-${p})" stop-opacity=".22"/><stop offset="1" stop-color="var(--p-${p})" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#sl-${p})"/><polyline points="${pts}" fill="none" stroke="var(--p-${p})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function insights(cur, ref) {
  const out = [], add = (k, tag, html) => out.push(`<div class="in"><em class="${k}">${tag}</em><div>${html}</div></div>`);
  // 1 涨粉主力
  const g7 = FANP.map(p => ({ p, v: gainN(p, 7) })).filter(x => x.v != null).sort((a, b) => b.v - a.v);
  if (g7.length) { const tot = g7.reduce((s, x) => s + x.v, 0); add('k3', '涨粉', `近 7 天涨粉最多的是<b>${PN[g7[0].p]} ${sgn(g7[0].v)}</b>${g7.length > 1 ? `，占 ${g7.map(x => PN[x.p]).join('、')} 合计 ${sgn(tot)} 的 <b>${pct(g7[0].v, tot)}</b>` : ''}。`); }
  // 2 发布日带来的涨粉
  if (ref && ref.schedule) {
    const d0 = ref.schedule.slice(0, 10), ps = FANP.filter(p => netOn(p, d0) != null), base = [];
    for (let i = 1; i <= 7; i++) { const d = dayStr(new Date(new Date(d0 + 'T12:00').getTime() - i * 864e5)); const v = ps.map(p => netOn(p, d)).filter(x => x != null); if (v.length === ps.length && ps.length) base.push(v.reduce((a, b) => a + b, 0)); }
    const on = ps.reduce((s, p) => s + netOn(p, d0), 0), avg = base.length ? base.reduce((a, b) => a + b, 0) / base.length : 0;
    if (ps.length && avg > 0) add('k3', '发布日', `「${esc(ref.nick)}」发布当天，${ps.map(p => PN[p]).join('、')}一共涨了 <b>${fmt(on)}</b> 粉，${on >= avg ? `是此前 7 天日均（${fmt(avg)}）的 <b>${(on / avg).toFixed(1)} 倍</b>` : `比此前 7 天日均（${fmt(avg)}）<b>少 ${((1 - on / avg) * 100).toFixed(0)}%</b>，这一期当天没有带来额外涨粉`}。`);

  }

  const ch = O.site.channels.filter(c => ['bilibili', 'douyin', 'xiaohongshu', 'twitter', 'youtube'].includes(c.source) && c.reg >= 50).map(c => ({ ...c, r: c.vip / c.reg })).sort((a, b) => b.r - a.r);

  return out.slice(0, 6).join('') || '<div class="empty">数据还不够，过两天这里会有结论</div>';
}

      <div class="inf">${tabs}<div class="eyebrow">${eb}</div><h2>${esc(t1)}</h2>${t2 ? `<div class="subt">${esc(t2)}</div>` : ''}<div class="when"><span id="cd"></span><span style="color:var(--t3)">· ${esc(st)}</span></div>
        <div class="plats">${PL.map(p => task(cur, p)).filter(Boolean).map(t => { const u = safeUrl(t.url), on = t.state === 'published', cls = on ? 'on' : ['awaiting_user', 'filled'].includes(t.state) ? 'todo' : ['failed', 'not_logged_in'].includes(t.state) ? 'bad' : ''; return `<${u ? `a href="${u}" target="_blank" rel="noopener"` : 'div'} class="pl ${cls}" data-tip="${PN[t.platform]}  ${esc(t.stateCn)}${t.detail ? '\n' + esc(t.detail) : ''}">${logo(t.platform)}<div><b>${PN[t.platform]}</b><span>${on ? (t.m ? (SL.length > 1 ? kfmt(t.m.views) : fmt(t.m.views) + ' 播放') : '已发布') : esc(t.stateCn)}</span></div></${u ? 'a' : 'div'}>`; }).join('')}</div>

function draw() { if (!O) return; const ins = document.querySelector('.ins'); if (ins && innerWidth > 1100) { [...ins.children].forEach(c => c.style.display = ''); for (let k = ins.children.length - 1; k > 0 && ins.scrollHeight > ins.clientHeight + 2; k--) ins.children[k].style.display = 'none'; } const el = $('#c-fans'); if (!el) return; drawFans(el, daysBack(30), Object.fromEntries(O.episodes.filter(e => e.schedule).map(e => [e.schedule.slice(0, 10), e.nick]))); }
