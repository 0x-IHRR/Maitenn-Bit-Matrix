<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<title>比特媒体矩阵</title>
<meta name="apple-mobile-web-app-title" content="比特媒体矩阵">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/mt.css">

<script src="/static/profile-scope.js"></script>
<script src="/static/bit-profiles.js" defer></script>
</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div>
<div class="page" id="app"><div class="empty" style="height:60vh">加载中…</div></div>
<script src="/static/mt.js"></script>
<script src="/static/editorial.js"></script>
<script>
let O = null, I = null, F = {}, timer = null, pick = null;
const toasted = new Set();
let doctorPrimed = false;
function doctorMsg(a, h) {
  if (!a.ok) { const err = String(a.tail || '').split('\n').map(s => s.trim()).filter(Boolean).slice(-1)[0]; return `体检失败${err ? '：' + err : ''}`; }
  const ps = (h.platforms || []).filter(p => !p.disabled && (!a.platform || p.id === a.platform));
  if (a.platform) {
    const p = (h.platforms || []).find(x => x.id === a.platform) || ps[0];
    if (!p) return `${PN[a.platform] || a.platform}：体检完成`;
    if (p.state === 'ok') return `${PN[p.id]}：已登录`;
    if (p.state === 'out') return `${PN[p.id]}：未登录${p.reason ? ' · ' + p.reason : ''}`;
    return `${PN[p.id]}：还没检查到状态`;
  }
  const ok = ps.filter(p => p.state === 'ok'), bad = ps.filter(p => p.state && p.state !== 'ok');
  if (!ps.length) return '体检完成';
  if (!bad.length) return `体检完成：${ok.length} 家全部已登录`;
  return `体检完成：${ok.length} 家正常，${bad.length} 家掉线（${bad.map(p => PN[p.id]).join('、')}）`;
}
function noteDoctorDone(h) {
  const docs = (O.actions || []).filter(x => x.type === 'doctor' && x.done && x.endedAt);
  if (!doctorPrimed) { for (const a of docs) toasted.add(`${a.startedAt}|${a.platform || ''}`); doctorPrimed = true; return; }
  for (const a of docs) {
    const k = `${a.startedAt}|${a.platform || ''}`;
    if (toasted.has(k)) continue;
    toasted.add(k);
    toast(doctorMsg(a, h), 4200);
  }
}
const dayStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const gainN = (p, n) => { const t = dayStr(new Date()), b = dayStr(new Date(Date.now() - n * 864e5)); return F[p] && F[p][t] != null && F[p][b] != null ? F[p][t] - F[p][b] : null; };
const latest = (p) => { const d = Object.keys(F[p] || {}).sort(); return d.length ? { day: d[d.length - 1], total: F[p][d[d.length - 1]], n: d.length } : null; };
const M = (e, p) => ((e.tasks.find(t => t.platform === p) || {}).m) || null;
const busy = () => O.actions.some(a => !a.done);
const abtn = (a, text, cls = '', cf = '') => `<button class="btn ${cls}" ${O.matrixReadOnly || busy() ? 'disabled' : ''} data-act='${esc(JSON.stringify(a))}' data-confirm="${esc(cf)}">${text}</button>`;
const tile = (lab, val, sub = '') => `<div class="panel tile"><div class="lab">${lab}</div><div class="val">${val}</div><div class="dl">${sub}</div></div>`;
const sec = (t, note = '') => `<div class="sec"><h2>${t}</h2><span class="note">${note}</span></div>`;
const epNo = (x) => (x.episode || x.episode === 0) && String(x.episode).trim() !== '' ? `第 ${esc(x.episode)} 期` : '';
const epc = (x) => `<span class="epc">${x.covers.length ? `<img src="/cover?id=${encodeURIComponent(x.id)}&k=${x.covers.includes('4x3') ? '4x3' : x.covers[0]}" alt="">` : '<i></i>'}<span><b>${esc(x.nick)}</b><small>${[epNo(x), when(x.schedule || x.createdAt).split(' ')[0]].filter(Boolean).join(' · ')}</small></span></span>`;
const samplesOf = (e) => PL.map(p => ({ name: PN[p], pts: O.samples.filter(s => s.episode_id === e.id && s.platform === p && s.views != null).map(s => [Date.parse(s.ts + ':00Z'), s.views]) })).filter(s => s.pts.length).sort((a, b) => b.pts[b.pts.length - 1][1] - a.pts[a.pts.length - 1][1]);
let after = () => {};

function weeklyBlock() {
  const w = O.weekly; if (!w) return '';
  return `${sec('上周周报', `${esc(w.from)} ～ ${esc(w.to)} · 每周一滚动`)}
  <div class="panel"><p class="fine">${esc(w.note || '')}</p>
  <div class="grid g3" style="margin-top:12px">${tile('矩阵粉丝变化', fmt(w.followerDelta), `自有 ${fmt(w.ownedFollowerDelta)} · 对标 ${fmt(w.benchmarkFollowerDelta)}`)}</div>
  <div class="tw" style="margin-top:12px"><table><thead><tr><th>账号</th><th>分组</th><th class="n">粉丝变化</th></tr></thead><tbody>${(w.accounts || []).map(a => `<tr><td>@${esc(a.identity)}</td><td>${a.group === 'benchmark' ? '对标' : '自有'}</td><td class="n">${a.delta == null ? '–' : sgn(a.delta)}</td></tr>`).join('') || '<tr><td colspan="3">上周还没有可比的粉丝记录</td></tr>'}</tbody></table></div>
  <div class="fine" style="margin-top:10px">播放最高：${(w.top || []).slice(0, 3).map(p => `@${esc(p.identity)} ${esc(p.title)} ${fmt(p.views)}`).join(' · ') || '还没有播放数'}</div></div>`;
}
function analyticsSummary() {
  const a = O.analytics || {};
  const rows = a.accounts || [];
  const trend = rows.flatMap(account => (account.followerTrend || []).map(point => `${esc(account.identity)} ${esc(point.day)} +${fmt(point.value)}`)).slice(-6);
  return `${sec('X Analytics', '自有号后台。跟每天最多 2 次的采集读同一个窗口，不另开一轮')}
  <div class="panel"><div class="grid g4">${tile('总曝光', a.impressions == null ? '还没有' : fmt(a.impressions))}${tile('主页访问', a.profileVisits == null ? '还没有' : fmt(a.profileVisits))}${tile('链接点击', a.linkClicks == null ? '还没有' : fmt(a.linkClicks))}</div>
  ${rows.length ? `<div class="tw" style="margin-top:12px"><table><thead><tr><th>账号</th><th class="n">曝光</th><th class="n">互动率</th><th class="n">主页访问</th><th class="n">链接点击</th><th>新增粉丝</th></tr></thead><tbody>${rows.map(account => `<tr><td>@${esc(account.identity)}</td><td class="n">${fmt(account.impressions)}</td><td class="n">${account.engagementRate == null ? '–' : account.engagementRate + '%'}</td><td class="n">${fmt(account.profileVisits)}</td><td class="n">${fmt(account.linkClicks)}</td><td>${(account.followerTrend || []).slice(-3).map(point => `${esc(point.day)} +${fmt(point.value)}`).join(' · ') || '–'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="fine">自有号还没有 Analytics。下次采集会在已经打开的比特窗口里读，失败会留在顶部红条。</p>'}
  ${trend.length ? `<p class="fine">近期新增粉丝：${trend.join(' · ')}</p>` : ''}
  <div class="btns"><a class="btn" href="/api/bt/export?kind=all">导出全部 CSV</a><a class="btn" href="/api/bt/export?kind=accounts">账号 CSV</a><a class="btn" href="/api/bt/export?kind=posts">帖子 CSV</a><a class="btn" href="/api/bt/export?kind=analytics">Analytics 历史 CSV</a></div></div>`;
}
function vTraffic() {
  const eps = O.episodes.filter(e => e.tasks.some(t => t.m && t.m.views != null)); if (!eps.length) return `<div class="h1">流量</div><p class="lead">还没采到流量。</p>${weeklyBlock()}${analyticsSummary()}${abtn({ type: 'metrics' }, '现在采一次', 'pri')}`;
  const all = sum(eps, 'views'), it = sum(eps, 'inter'), byP = PL.map(p => ({ p, v: eps.reduce((s, e) => s + ((M(e, p) || {}).views || 0), 0) })).sort((a, b) => b.v - a.v);
  const e = eps.find(x => x.id === pick) || eps[0], rows = PL.map(p => ({ p, m: M(e, p), t: e.tasks.find(t => t.platform === p) })).filter(r => r.m), mx = Math.max(...rows.map(r => r.m.views || 0), 1);
  after = () => { const el = $('#c-line'); if (el) drawLines(el, samplesOf(e)); };
  return `<div class="h1">流量</div><p class="lead">查看本工作台已登记作品的播放和互动。新帖 72 小时内的点，跟着每天最多 2 次的采集记下。</p>
  ${weeklyBlock()}
  ${analyticsSummary()}
  <div class="grid g4">${tile('累计播放', fmt(all), `${eps.length} 期合计`)}${tile('累计互动', fmt(it), `互动率 ${pct(it, all, 1)}`)}${tile('平均每期播放', fmt(all / eps.length))}${tile('播放最多的平台', PN[byP[0].p], `${fmt(byP[0].v)}，占 ${pct(byP[0].v, all)}`)}</div>
  ${sec('每期 × 平台', '格子里是播放数，细条是这一期里的占比')}
  <div class="panel"><div class="tw"><table><thead><tr><th>期</th>${PL.map(p => `<th class="n">${logo(p)}${PN[p]}</th>`).join('')}<th class="n">合计</th><th class="n">互动率</th></tr></thead><tbody>
    ${eps.map(x => { const m2 = Math.max(...PL.map(p => (M(x, p) || {}).views || 0), 1); return `<tr><td><a href="#/ep/${encodeURIComponent(x.id)}" title="${esc(x.name)}">${epc(x)}</a></td>${PL.map(p => { const m = M(x, p); return `<td class="n">${m ? fmt(m.views) : '–'}<span class="cellbar"><i style="width:${m ? (m.views / m2 * 100).toFixed(0) : 0}%"></i></span></td>`; }).join('')}<td class="n"><b>${fmt(x.views)}</b></td><td class="n">${pct(x.inter, x.views, 1)}</td></tr>`; }).join('')}</tbody></table></div></div>
  ${sec(`${esc(e.nick)} · 各平台明细`, eps.length > 1 ? eps.map(x => `<a href="#/traffic" data-pick="${esc(x.id)}" style="margin-left:12px;${x.id === e.id ? 'color:var(--accent);font-weight:600' : ''}" title="${esc(x.name)}">${esc(x.nick)}</a>`).join('') : '')}
  <div class="panel"><div class="tw"><table><thead><tr><th>平台</th><th class="n">播放</th><th class="n">赞</th><th class="n">评论</th><th class="n">收藏</th><th class="n">转发</th><th class="n">互动率</th><th class="n">收藏率</th><th></th></tr></thead><tbody>
    ${rows.sort((a, b) => b.m.views - a.m.views).map(r => { const u = safeUrl(r.t && r.t.url); return `<tr><td>${logo(r.p)}${PN[r.p]}</td><td class="n"><b>${fmt(r.m.views)}</b><span class="cellbar"><i style="width:${(r.m.views / mx * 100).toFixed(0)}%"></i></span></td><td class="n">${fmt(r.m.likes)}</td><td class="n">${fmt(r.m.comments)}</td><td class="n">${fmt(r.m.favorites)}</td><td class="n">${fmt(r.m.shares)}</td><td class="n">${r.m.views ? pct(inter(r.m), r.m.views, 1) : '–'}</td><td class="n">${r.m.views && r.m.favorites != null ? pct(r.m.favorites, r.m.views, 1) : '–'}</td><td class="n">${u ? `<a href="${u}" target="_blank" rel="noopener">打开 ↗</a>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>
  ${sec(`${esc(e.nick)} · 播放走势`, '每次采样一个点')}<div class="panel"><div class="chartbox" id="c-line"></div></div>
  ${sec('粉丝', '按手动更新保存的记录计算变化')}
  <div class="panel"><div class="tw"><table><thead><tr><th>平台</th><th class="n">现在</th><th class="n">今日</th><th class="n">近 7 天</th><th class="n">近 30 天</th><th class="n">已记录</th></tr></thead><tbody>
    ${PL.map(p => { const l = latest(p); const g = (n) => { const v = gainN(p, n); return v == null ? '<span style="color:var(--t3)">–</span>' : sgn(v); }; return l ? `<tr><td>${logo(p)}${PN[p]}</td><td class="n"><b>${fmt(l.total)}</b></td><td class="n">${g(1)}</td><td class="n">${g(7)}</td><td class="n">${g(30)}</td><td class="n">${l.n} 天</td></tr>` : ''; }).join('')}</tbody></table></div></div>
  <div class="btns" style="margin-top:18px">${abtn({ type: 'metrics' }, '现在采一次流量')}${abtn({ type: 'followers' }, '现在采一次粉丝')}</div>`;
}

function vArchive() {
  if (!O.episodes.length) return `<div class="h1">档案</div><p class="lead">还没有登记的期数。</p>`;
  return `<div class="h1">档案</div><p class="lead">已采集的作品、播放和复盘。</p>
  <div class="wall">${O.episodes.map(e => `<a class="panel poster" href="#/ep/${encodeURIComponent(e.id)}"><div class="im" style="${e.covers.length ? `background-image:url('/cover?id=${encodeURIComponent(e.id)}&k=${e.covers.includes('4x3') ? '4x3' : e.covers[0]}')` : ''}"></div>
    <div class="tx"><div class="ep">${[e.personaName, epNo(e), when(e.schedule || e.createdAt)].filter(Boolean).join(' · ')}</div><h3>${esc(e.name)}</h3><div class="mt"><span class="gpill">${e.views != null ? fmt(e.views) + ' 播放' : '还没有播放数据'}</span><span class="gpill">${e.tasks.filter(t => t.m).length}/${e.tasks.length} 已采集</span></div></div></a>`).join('')}</div>`;
}

async function vEpisode(id) {
  const e = await api('/api/episode?id=' + encodeURIComponent(id)), [t1, t2] = e.name.split(/[｜|]/).map(x => x.trim());
  after = () => { const el = $('#c-line'); if (el) drawLines(el, samplesOf(e)); };
  return `<a class="back" href="#/archive">‹ 档案</a>
  <div class="panel ephero">${e.covers.length ? `<img src="/cover?id=${encodeURIComponent(e.id)}&k=${e.covers.includes('4x3') ? '4x3' : e.covers[0]}" alt="">` : '<div></div>'}
    <div><div class="eyebrow">${epNo(e) || '作品'}</div><div class="h1" style="margin:6px 0">${esc(t1)}</div>${t2 ? `<p class="lead" style="margin:0 0 14px">${esc(t2)}</p>` : ''}
      <div style="display:flex;gap:34px;flex-wrap:wrap;margin:6px 0 16px"><div><div class="lab" style="font-size:12px;color:var(--t3)">全平台播放</div><div class="val">${e.views != null ? fmt(e.views) : '–'}</div></div><div><div style="font-size:12px;color:var(--t3)">互动</div><div class="val">${e.inter != null ? fmt(e.inter) : '–'}</div></div><div><div style="font-size:12px;color:var(--t3)">互动率</div><div class="val">${e.views > 1 ? pct(e.inter, e.views, 1) : '–'}</div></div><div><div style="font-size:12px;color:var(--t3)">已采集</div><div class="val">${e.tasks.filter(t => t.m).length}/${e.tasks.length}</div></div></div>
      <dl class="kv"><dt>记录时间</dt><dd>${e.schedule ? when(e.schedule) : (e.createdAt ? when(e.createdAt) : '未记录')}</dd>${e.personaName ? `<dt>人设</dt><dd>${esc(e.personaName)}</dd>` : ''}${e.durationSec ? `<dt>时长</dt><dd>${Math.floor(e.durationSec / 60)} 分 ${Math.round(e.durationSec % 60)} 秒</dd>` : ''}${e.campaign ? `<dt>链接标记</dt><dd>${esc(e.campaign)}</dd>` : ''}<dt>关联文件</dt><dd>${e.files.length ? e.files.map(esc).join('、') : '没有关联工程'}</dd></dl>
      <div class="btns" style="margin-top:16px">${abtn({ type: 'metrics', id: e.id }, '采这一期的流量', 'pri')}</div></div></div>
  ${e.accountAnalytics || e.tasks.some(t => t.analytics) ? `${sec('Analytics 明细', '后台曝光和互动，不替代时间线上的公开播放')}<div class="panel"><div class="tw"><table><thead><tr><th>范围</th><th class="n">曝光</th><th class="n">互动率</th><th class="n">主页访问</th><th class="n">链接点击</th><th>新增粉丝</th></tr></thead><tbody>
    ${e.accountAnalytics ? `<tr><td>账号</td><td class="n">${fmt(e.accountAnalytics.impressions)}</td><td class="n">${e.accountAnalytics.engagementRate == null ? '–' : e.accountAnalytics.engagementRate + '%'}</td><td class="n">${fmt(e.accountAnalytics.profileVisits)}</td><td class="n">${fmt(e.accountAnalytics.linkClicks)}</td><td>${(e.accountAnalytics.followerTrend || []).slice(-3).map(point => `${esc(point.day)} +${fmt(point.value)}`).join(' · ') || '–'}</td></tr>` : ''}
    ${e.tasks.filter(t => t.analytics).map(t => `<tr><td>这条帖</td><td class="n">${fmt(t.analytics.impressions)}</td><td class="n">${t.analytics.engagementRate == null ? '–' : t.analytics.engagementRate + '%'}</td><td class="n">${fmt(t.analytics.profileVisits)}</td><td class="n">${fmt(t.analytics.linkClicks)}</td><td>${[t.analytics.likes, t.analytics.replies, t.analytics.reposts].some(v => v != null) ? `赞 ${fmt(t.analytics.likes)} · 回复 ${fmt(t.analytics.replies)} · 转帖 ${fmt(t.analytics.reposts)}` : '–'}</td></tr>`).join('')}
  </tbody></table></div></div>` : ''}
  ${sec('各平台')}
  <div class="panel"><div class="tw"><table><thead><tr><th>平台</th><th>状态</th><th class="n">播放</th><th class="n">赞</th><th class="n">评论</th><th class="n">收藏</th><th class="n">转发</th><th class="n">互动率</th><th></th></tr></thead><tbody>
    ${PL.map(p => e.tasks.find(t => t.platform === p)).filter(Boolean).map(t => { const m = t.m || {}, u = safeUrl(t.url); return `<tr><td>${logo(t.platform)}${esc(PN[t.platform] || t.name)}</td><td>${chip(t)}</td><td class="n"><b>${fmt(m.views)}</b></td><td class="n">${fmt(m.likes)}</td><td class="n">${fmt(m.comments)}</td><td class="n">${fmt(m.favorites)}</td><td class="n">${fmt(m.shares)}</td><td class="n">${m.views ? pct(inter(m), m.views, 1) : '–'}</td><td class="n">${u ? `<a href="${u}" target="_blank" rel="noopener">打开 ↗</a>` : `<span style="color:var(--t3)">${esc(t.detail).slice(0, 18)}</span>`}</td></tr>`; }).join('')}</tbody></table></div></div>
  ${e.reviews && e.reviews.length ? `${sec('复盘', '第 1 / 3 / 7 天。同龄对比用上一期同样天数的播放')}<div class="panel"><div class="tw"><table><thead><tr><th>采集后</th><th class="n">播放</th><th class="n">互动率</th><th>上一期同龄</th><th class="n">对比</th><th class="n">期间涨粉</th><th class="n">72 小时密采样</th></tr></thead><tbody>
    ${e.reviews.map(r => `<tr><td><b>第 ${r.age} 天</b>${r.partial ? '<span style="color:var(--t3);font-size:12px;margin-left:6px">进行中</span>' : ''}</td><td class="n"><b>${fmt(r.views)}</b></td><td class="n">${pct(r.ints, r.views, 1)}</td><td>${r.prev ? `「${esc(r.prev.nick)}」${fmt(r.prev.views)}` : '<span style="color:var(--t3)">没有可比的上一期</span>'}</td><td class="n">${r.prev && r.prev.views && r.views != null ? (r.views >= r.prev.views ? `<b style="color:var(--good)">${(r.views / r.prev.views).toFixed(1)} 倍</b>` : `<b style="color:var(--crit)">${pct(r.views, r.prev.views, 0)}</b>`) : '–'}</td><td class="n">${r.fans ? (r.fans > 0 ? '+' : '') + fmt(r.fans) : '–'}</td><td class="n">${r.dense ? '72h 内' : '–'}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
  ${sec('播放走势', '每次采样一个点')}<div class="panel"><div class="chartbox" id="c-line"></div></div>
  ${sec('采集到的文案', e.snapshotAt ? `存档于 ${when(e.snapshotAt)}` : '没有单独的文案存档')}
  <div class="panel">${PL.map(p => e.tasks.find(t => t.platform === p)).filter(Boolean).map(t => `<details><summary>${logo(t.platform)}<b>${esc(PN[t.platform] || t.name)}</b><span>${esc(t.copy.title || t.copy.body.slice(0, 50))}</span></summary>${t.copy.title ? `<div class="copy"><b>${esc(t.copy.title)}</b></div>` : ''}${t.copy.body ? `<div class="copy">${esc(t.copy.body)}</div>` : ''}${t.copy.tags.length ? `<div style="margin-top:8px;font-size:12.5px;color:var(--t3)">${t.copy.tags.map(x => '#' + esc(x)).join('  ')}</div>` : ''}${t.shot ? `<img class="shot" loading="lazy" src="/shot?id=${encodeURIComponent(e.id)}&p=${t.platform}" alt="提交前的页面截图">` : ''}</details>`).join('')}</div>
  ${sec('过程记录')}<div class="panel"><div class="mono">${e.logs.length ? e.logs.map(l => { let r = l.result || ''; try { const j = JSON.parse(r); r = [j.status, j.url, j.note].filter(Boolean).join('  '); } catch {} return `${when(l.ts)}  ${esc(PN[l.platform] || l.platform || '-')}  ${esc(l.action)}  ${esc(r)}`; }).join('\n') : '没有记录'}</div></div>`;
}

// 集成卡片：飞书 / Telegram。通知只报采集和健康，不发帖。
const itg = () => I || { telegram: {}, feishu: {} };
const tgState = (t = {}) => !t.enabled ? '<span class="istate idle">未启用</span>' : fsState({ webhook: true, lastTest: t.lastTest });
const fsState = (f) => {
  if (!f.webhook) return '<span class="istate idle">未配置</span>';
  const t = f.lastTest;
  if (!t) return '<span class="istate idle">未测试</span>';
  const hm = String(t.ts || '').slice(11, 16);
  return t.ok ? `<span class="istate ok">✓ 已连接${hm ? ` · 上次测试 ${hm}` : ''}</span>` : `<span class="istate bad">✗ ${esc(t.error || '测试失败')}</span>`;
};
let fsDraft = null, tgDraft = null;
function captureTgDraft() {
  if ($('#tg-token')) tgDraft = { enabled: $('#tg-on').checked, botToken: $('#tg-token').value, chatId: $('#tg-chat').value };
}
const tgVals = () => tgDraft || { enabled: !!itg().telegram?.enabled, botToken: '', chatId: itg().telegram?.chatId || '' };
function captureFsDraft() { const el = $('#fs-webhook'); if (el) fsDraft = el.value; }
function paintFs() {
  const el = $('#fs-state'); if (el) el.innerHTML = fsState(itg().feishu);
  const wh = $('#fs-webhook'); if (wh && fsDraft != null) wh.value = fsDraft;
  const cb = $('#fs-login'); if (cb) { cb.checked = !!itg().feishu.login; cb.disabled = !itg().feishu.webhook; }
}
function vSystem() {
  const h = O.health, scope = O.scope || {}, ps = (h.platforms || []).filter(p => p.id === 'x' && !p.disabled);
  const stOf = (p) => p.disabled ? ['off', '–', '已停用'] : p.state === 'ok' ? ['published', '✓', '已登录'] : p.state === 'out' ? ['not_logged_in', '✕', '未登录'] : ['idle', '?', '未检查'];
  return `<div class="h1">系统</div><p class="lead">本工作台的比特环境、自有号与对标号。定时采集默认每天 1 次，最多 2 次；也可以手动更新。</p>
  ${healthNotices(h)}
  <div class="grid g4">${tile('比特接口', scope.connectionError ? '异常' : scope.connectionError === '' ? '已连接' : '未检查', esc(scope.connectionError || '本机 Local API'))}${tile('纳管 Profile', fmt(scope.profileCount), `${fmt(scope.runningCount)} 个运行中`)}${tile('账号身份', platformSummary(h), '写入数据前核验实际登录账号')}${tile('数据更新', '手动触发', `最后成功获取 ${when(scope.lastSuccess) || '尚未获取'}`)}</div>
  ${sec('只读采集', '检查登录态并读取粉丝、帖子。不打开发布页，不点赞、关注、评论或转发。')}
  <div class="panel"><div class="btns" style="margin-bottom:4px">${abtn({ type: 'doctor' }, '全部检查', 'pri')}${abtn({ type: 'metrics' }, '采流量')}${abtn({ type: 'followers' }, '采粉丝')}</div>
    ${ps.map(p => { const [c, i, t] = stOf(p); return `<div class="prow pl-row">${logo(p.id)}<span class="n" style="width:auto;margin-right:auto">${PN[p.id]}<span class="pl-sub">${esc(p.reason || (p.day ? `上次检查 ${p.day}` : '还没检查过'))}</span></span><span class="st-chip ${c}"><i>${i}</i>${t}</span>${abtn({ type: 'doctor', platform: p.id }, '检查')}</div>`; }).join('') || '<div class="empty" style="height:50px">暂无启用的 X 平台账号，请在下方账号管理里绑定。</div>'}</div>
  ${sec('通知', 'Telegram 与飞书只接收采集和健康提醒')}
  <div class="panel" style="margin-bottom:16px">
    <div class="ph"><h3>Telegram 通知</h3><span class="note" id="tg-state">${tgState(itg().telegram)}</span></div>
    <label class="swrow"><input type="checkbox" class="switch" id="tg-on" ${tgVals().enabled ? 'checked' : ''}><span>启用 Telegram 通知</span></label>
    <div class="grid2">
      <div><label class="lab" for="tg-token">Bot Token</label><input class="inp" id="tg-token" type="password" autocomplete="new-password" value="${esc(tgVals().botToken)}" placeholder="${itg().telegram?.hasToken ? '已保存，留空保留原 Token' : '从 @BotFather 获取'}"></div>
      <div><label class="lab" for="tg-chat">Chat ID</label><input class="inp" id="tg-chat" value="${esc(tgVals().chatId)}" placeholder="接收通知的用户、群组或频道 ID"></div>
    </div>
    <div class="btns"><button type="button" class="btn pri" data-tg="test">测试发送</button><button type="button" class="btn" data-tg="save">保存</button></div>
    <div class="fine">先与机器人开始聊天，或将它加入目标群组；发送到频道时需授予发消息权限。保存后立即生效。</div>
  </div>
  <div class="sys-2col sys-itg">
    <div class="panel">
      <div class="ph"><h3>飞书</h3><span class="note" id="fs-state">${fsState(itg().feishu)}</span></div>
      <label class="lab" for="fs-webhook">群机器人 webhook</label>
      <input class="inp" id="fs-webhook" type="text" value="${esc(itg().feishu.webhook || '')}" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/...">
      <div class="btns"><button type="button" class="btn pri" data-fs="test">测试发送</button><button type="button" class="btn" data-fs="save">保存</button></div>
      <label class="swrow"><input type="checkbox" class="switch" id="fs-login" ${itg().feishu.login ? 'checked' : ''} ${itg().feishu.webhook ? '' : 'disabled'}><span>用飞书验证码登录 <small>远程打开时推 6 位验证码，替代网页口令</small></span></label>
      <div class="fine">保存后立即生效，不用重启</div>
    </div>
  </div>
  <div class="sys-2col">
    <div class="panel sys-tasks">
      <div class="ph"><h3>更新方式</h3></div>
      <div class="sys-scroll"><dl class="kv"><dt>平台数据</dt><dd>定时每天 1–2 次，或在上方手动更新。Analytics 跟同一次采集读，不另计次数</dd><dt>浏览器环境</dt><dd>自有号按需打开比特窗口，只关闭本次打开的窗口</dd><dt>对标账号</dt><dd>不登录、不走比特，读公开接口或导入外部 JSON</dd><dt>账号验证</dt><dd>登录页、验证码或限流会暂停该号并在面板告警，不自动连试</dd><dt>导出</dt><dd><a href="/api/bt/export?kind=all">全部 CSV</a> · <a href="/api/bt/export?kind=analytics">Analytics 历史 CSV</a></dd></dl></div>
    </div>
    <div class="panel sys-feed">
      <div class="ph"><h3>最近动态</h3></div>
      <div class="sys-scroll">${O.feed.map(f => `<div class="fd"><span class="tm">${when(f.ts).split(' ')[1]}</span><span class="ep">${f.nick ? esc(f.nick) : '<span class="plat-tag">平台</span>'}</span><span>${esc(f.platform)}</span><span class="rs">${esc(f.action)}${f.result ? ' · ' + esc(f.result) : ''}</span></div>`).join('') || '<div class="empty" style="height:60px">还没有动态</div>'}</div>
    </div>
  </div>`;
}

async function render() {
  dispatchEvent(new Event('maitian:before-render'));
  captureFsDraft(); captureTgDraft();
  const h = location.hash || '#/traffic', key = h.startsWith('#/ep/') ? 'archive' : h.slice(2).split('/')[0], app = $('#app'); after = () => {};
  let body; try { body = h.startsWith('#/ep/') ? await vEpisode(decodeURIComponent(h.slice(5))) : ({ traffic: vTraffic, archive: vArchive, system: vSystem, matrix: () => { after = () => Editorial.drawMatrix(O); return Editorial.matrix(O); }, personas: () => Editorial.personas(O), calendar: () => Editorial.calendar(O), approval: () => Editorial.approval(O) }[key] || vTraffic)(); } catch (e) { body = `<div class="empty" style="height:40vh">出错了：${esc(e.message)}</div>`; }
  app.innerHTML = topbar(O, key) + body; after(); dispatchEvent(new Event('maitian:render'));
  if (fsDraft != null) { const wh = $('#fs-webhook'); if (wh) wh.value = fsDraft; }
}
async function load() {
  try { captureFsDraft(); captureTgDraft(); const scope = document.cookie.match(/(?:^|; )bt_profile=([^;]*)/)?.[1] || 'matrix'; const next = await api('/api/overview'); const integrations = await api('/api/integrations').catch(() => null); if (scope !== (document.cookie.match(/(?:^|; )bt_profile=([^;]*)/)?.[1] || 'matrix')) return; O = next; I = integrations; const off = new Set((O.health.platforms || []).filter(p => p.disabled).map(p => p.id)); PL = PL_ALL.filter(p => !off.has(p)); F = {}; for (const r of O.followers) (F[r.platform] ||= {})[r.day] = r.total; noteDoctorDone(O.health); await render(); }
  catch (e) { if (!O) $('#app').innerHTML = `<div class="empty" style="height:60vh">连不上本工作台服务（${esc(e.message)}）</div>`; }
}
function poll() { clearInterval(timer); timer = setInterval(async () => { await load(); if (!busy()) { clearInterval(timer); timer = null; } }, 4000); }
document.addEventListener('click', async (e) => {
  const pk = e.target.closest('[data-pick]'); if (pk) { e.preventDefault(); pick = pk.dataset.pick; render(); return; }
  const tgb = e.target.closest('[data-tg]');
  if (tgb) {
    captureTgDraft(); tgb.disabled = true;
    const kind = tgb.dataset.tg;
    try {
      const r = await fetch('/api/integrations/telegram' + (kind === 'test' ? '/test' : ''), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(tgDraft) });
      const j = await r.json();
      if (!r.ok) toast(j.error || '操作失败');
      else if (kind === 'test') {
        I.telegram = { ...itg().telegram, lastTest: { ...j, ts: new Date().toISOString() } };
        toast(j.ok ? '已发送，去 Telegram 看看' : (j.error || '发送失败'));
      } else {
        I.telegram = j.telegram; $('#tg-token').value = ''; tgDraft = null;
        $('#tg-token').placeholder = j.telegram.hasToken ? '已保存，留空保留原 Token' : '从 @BotFather 获取';
        toast('已保存');
      }
      $('#tg-state').innerHTML = tgState(itg().telegram);
    } catch { toast('连接失败，请重试'); }
    finally { tgb.disabled = false; }
    return;
  }
  const fsb = e.target.closest('[data-fs]');
  if (fsb) {
    const kind = fsb.dataset.fs; fsb.disabled = true;
    if (kind === 'test') {
      const r = await fetch('/api/integrations/feishu/test', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ webhook: $('#fs-webhook').value }) }), j = await r.json().catch(() => ({}));
      if (!r.ok) toast(j.error || '没成功');
      else { I.feishu = { ...itg().feishu, lastTest: { ...j, ts: new Date().toISOString() } }; paintFs(); toast(j.ok ? '已发送，去飞书看看' : (j.error || '发送失败')); }
    } else {
      const r = await fetch('/api/integrations/feishu', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ webhook: $('#fs-webhook').value, login: $('#fs-login').checked }) }), j = await r.json().catch(() => ({}));
      toast(r.ok ? '已保存' : (j.error || '没成功'));
      if (r.ok) { I.feishu = j.feishu; paintFs(); }
    }
    fsb.disabled = false; return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return; const a = JSON.parse(b.dataset.act);
  if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
  const r = await fetch('/api/action', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(a) }), j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || '没成功'); return; }
  toast(a.type === 'doctor' ? (a.platform ? `开始检查${PN[a.platform] || a.platform}…` : '开始全部检查…') : '已开始，跑完会自动刷新');
  await load(); poll();
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'fs-login' && I) {
    const r = await fetch('/api/integrations/feishu', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ webhook: $('#fs-webhook').value, login: e.target.checked }) }), j = await r.json().catch(() => ({}));
    if (r.ok) { I.feishu = j.feishu; paintFs(); toast(j.feishu.login ? '已开启验证码登录' : '已关闭验证码登录'); }
    else { toast(j.error || '没成功'); paintFs(); }
  }
});
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
addEventListener('editorial:reload', () => load());
addEventListener('resize', () => after());
load(); setInterval(() => { if (!timer && !document.hidden && !document.querySelector('details[open]')) load(); }, 60000);
</script>
</body>
